<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Vault - Sistem Manajemen Prompt</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body id="body-theme" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <header id="header-theme" class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-500 to-violet-500 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-terminal text-white text-lg"></i>
                </div>
                <div>
                    <h1 id="title-text" class="font-bold text-lg text-white tracking-tight">Prompt Vault <span class="text-indigo-400 font-medium text-sm ml-1.5">by Deon Tech</span></h1>
                    <p id="subtitle-text" class="text-xs text-slate-400">Simpan & Kelola Prompt AI Anda</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl font-medium text-sm transition flex items-center space-x-2 border border-slate-700">
                    <i id="theme-icon" class="fa-solid fa-sun text-amber-400"></i>
                    <span id="theme-text" class="hidden sm:inline">Terang</span>
                </button>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/20 flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Tambah Prompt</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar Filters & Categories -->
        <aside class="w-full md:w-64 space-y-6 shrink-0">
            <div id="sidebar-card" class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 shadow-sm backdrop-blur transition-colors duration-300">
                <h2 id="cat-header-text" class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 px-2">Kategori</h2>
                <nav id="category-list" class="space-y-1">
                    <button onclick="filterCategory('all')" id="cat-all" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition bg-indigo-600/10 text-indigo-400 border border-indigo-500/20">
                        <span class="flex items-center space-x-2"><i class="fa-solid fa-layer-group w-5"></i><span>Semua Prompt</span></span>
                        <span id="count-all" class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300">0</span>
                    </button>
                    <button onclick="filterCategory('Coding')" id="cat-Coding" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                        <span class="flex items-center space-x-2"><i class="fa-solid fa-code w-5 text-blue-400"></i><span>Coding</span></span>
                        <span id="count-Coding" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                    </button>
                    <button onclick="filterCategory('Writing')" id="cat-Writing" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                        <span class="flex items-center space-x-2"><i class="fa-solid fa-pen-nib w-5 text-emerald-400"></i><span>Writing</span></span>
                        <span id="count-Writing" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                    </button>
                    <button onclick="filterCategory('Konten')" id="cat-Konten" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                        <span class="flex items-center space-x-2"><i class="fa-solid fa-video w-5 text-rose-400"></i><span>Konten</span></span>
                        <span id="count-Konten" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                    </button>
                    <button onclick="filterCategory('Marketing')" id="cat-Marketing" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                        <span class="flex items-center space-x-2"><i class="fa-solid fa-bullhorn w-5 text-amber-400"></i><span>Marketing</span></span>
                        <span id="count-Marketing" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                    </button>
                    <button onclick="filterCategory('Ideation')" id="cat-Ideation" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                        <span class="flex items-center space-x-2"><i class="fa-solid fa-lightbulb w-5 text-purple-400"></i><span>Ideation</span></span>
                        <span id="count-Ideation" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                    </button>
                    <button onclick="filterCategory('Lainnya')" id="cat-Lainnya" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                        <span class="flex items-center space-x-2"><i class="fa-solid fa-folder w-5 text-slate-400"></i><span>Lainnya</span></span>
                        <span id="count-Lainnya" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                    </button>
                </nav>
            </div>

            <div id="tips-card" class="bg-gradient-to-br from-indigo-950/40 to-slate-900 border border-indigo-900/30 rounded-2xl p-4 transition-colors duration-300">
                <h3 id="tips-header" class="text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-2">Tips Cepat</h3>
                <p id="tips-desc" class="text-xs text-slate-400 leading-relaxed">Gunakan variabel berformat <code class="bg-indigo-900/60 text-indigo-200 px-1 py-0.5 rounded font-mono">{{variabel}}</code> di dalam prompt Anda untuk memudahkan pengisian template nanti.</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 space-y-6">
            
            <!-- Search & Filter Bar -->
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-500"></i>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="Cari berdasarkan judul, isi prompt, atau tag..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                </div>
                <div class="sm:w-48">
                    <select id="sort-select" onchange="handleSort()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        <option value="newest">Terbaru</option>
                        <option value="oldest">Terlama</option>
                        <option value="title">Judul (A-Z)</option>
                    </select>
                </div>
            </div>

            <!-- Prompt Grid Container -->
            <div id="prompt-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamically injected prompt cards -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-2xl">
                <div class="w-16 h-16 bg-slate-900 rounded-full flex items-center justify-center text-slate-600 text-2xl mb-4">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3 id="empty-title" class="text-lg font-medium text-slate-300 mb-1">Belum ada prompt</h3>
                <p id="empty-desc" class="text-sm text-slate-500 max-w-sm mb-6">Mulai simpan prompt favorit Anda agar mudah digunakan kembali kapan saja.</p>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20">
                    Tambah Prompt Baru
                </button>
            </div>
        </div>

    </main>

    <div id="prompt-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div id="modal-box" class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative transition-colors duration-300">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                <h2 id="modal-title" class="text-lg font-bold text-white">Tambah Prompt Baru</h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="prompt-form" onsubmit="savePrompt(event)" class="space-y-4">
                <input type="hidden" id="prompt-id">
                
                <div>
                    <label id="lbl-title" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Judul Prompt</label>
                    <input type="text" id="input-title" required placeholder="Contoh: Pembuat Skrip Artikel SEO" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label id="lbl-cat" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Kategori</label>
                        <select id="input-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                            <option value="Coding">Coding</option>
                            <option value="Writing">Writing</option>
                            <option value="Konten">Konten</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Ideation">Ideation</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label id="lbl-tags" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Tag (Pisahkan dengan koma)</label>
                        <input type="text" id="input-tags" placeholder="seo, blog, ai" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>

                <div>
                    <label id="lbl-content" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Isi Prompt</label>
                    <textarea id="input-content" rows="6" required placeholder="Tulis prompt lengkap Anda di sini. Gunakan {{variabel}} untuk parameter..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition font-mono"></textarea>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 text-sm font-medium transition">Batal</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20">Simpan Prompt</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 border border-slate-800 text-slate-200 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all duration-300">
        <div id="toast-icon" class="text-indigo-400 text-lg"></div>
        <div id="toast-message" class="text-sm font-medium"></div>
    </div>

    <script>
        // Default Local State
        let prompts = JSON.parse(localStorage.getItem('prompt_vault_items')) || [
            {
                id: '1',
                title: 'Reviewer Kode Bersih (Clean Code)',
                category: 'Coding',
                tags: ['refactoring', 'clean-code', 'javascript'],
                content: 'Bertindaklah sebagai Senior Software Engineer. Review kode {{bahasa}} berikut berdasarkan prinsip SOLID, DRY, dan Clean Code:\n\n```{{bahasa}}\n{{kode}}\n```\n\nBerikan saran perbaikan beserta contoh kodenya.',
                createdAt: Date.now() - 86400000
            },
            {
                id: '2',
                title: 'Pembuat Kerangka Artikel Blog SEO',
                category: 'Writing',
                tags: ['seo', 'blogging', 'copywriting'],
                content: 'Buatlah kerangka artikel blog yang mendalam dan ramah SEO dengan topik "{{topik}}". Target audiens adalah {{audiens}}. Sertakan judul menarik, sub-heading H2/H3, dan meta deskripsi.',
                createdAt: Date.now() - 43200000
            },
            {
                id: '3',
                title: 'Hook Reels / TikTok Kreatif',
                category: 'Konten',
                tags: ['tiktok', 'reels', 'social-media', 'hook'],
                content: 'Buatlah 5 variasi hook (3 detik pertama) yang sangat memancing rasa penasaran audiens untuk topik konten tentang "{{topik}}". Target penonton adalah {{target}}.',
                createdAt: Date.now() - 10000000
            }
        ];

        let currentCategory = 'all';
        let currentSearch = '';
        let currentSort = 'newest';
        let currentTheme = localStorage.getItem('prompt_vault_theme') || 'dark';

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(currentTheme, false);
            renderPrompts();
        });

        // Theme Switcher Functionality
        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('prompt_vault_theme', currentTheme);
            applyTheme(currentTheme, true);
        }

        function applyTheme(theme, animate = true) {
            const body = document.getElementById('body-theme');
            const header = document.getElementById('header-theme');
            const sidebarCard = document.getElementById('sidebar-card');
            const tipsCard = document.getElementById('tips-card');
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');
            const modalBox = document.getElementById('modal-box');
            const titleText = document.getElementById('title-text');
            const subtitleText = document.getElementById('subtitle-text');
            const catHeaderText = document.getElementById('cat-header-text');
            const tipsHeader = document.getElementById('tips-header');
            const tipsDesc = document.getElementById('tips-desc');
            const emptyTitle = document.getElementById('empty-title');
            const emptyState = document.getElementById('empty-state');
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            const toast = document.getElementById('toast');

            if (theme === 'light') {
                // Light Mode Classes
                body.className = "bg-slate-50 text-slate-900 min-h-screen flex flex-col transition-colors duration-300";
                header.className = "bg-white border-b border-slate-200 sticky top-0 z-30 transition-colors duration-300 shadow-sm";
                sidebarCard.className = "bg-white border border-slate-200 rounded-2xl p-4 shadow-sm backdrop-blur transition-colors duration-300";
                tipsCard.className = "bg-gradient-to-br from-indigo-50 to-slate-100 border border-indigo-100 rounded-2xl p-4 transition-colors duration-300";
                searchInput.className = "w-full bg-slate-100 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition shadow-inner";
                sortSelect.className = "w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-indigo-500 transition";
                modalBox.className = "bg-white border border-slate-200 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative transition-colors duration-300";
                
                titleText.className = "font-bold text-lg text-slate-950 tracking-tight";
                subtitleText.className = "text-xs text-slate-500";
                catHeaderText.className = "text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3 px-2";
                tipsHeader.className = "text-xs font-semibold uppercase tracking-wider text-indigo-700 mb-2";
                tipsDesc.className = "text-xs text-slate-600 leading-relaxed";
                emptyTitle.className = "text-lg font-medium text-slate-800 mb-1";
                emptyState.className = "hidden flex-col items-center justify-center p-12 text-center bg-white border border-dashed border-slate-300 rounded-2xl shadow-sm";
                
                themeToggleBtn.className = "bg-slate-100 hover:bg-slate-200 text-slate-700 hover:text-slate-900 px-3.5 py-2 rounded-xl font-medium text-sm transition flex items-center space-x-2 border border-slate-200";
                themeIcon.className = "fa-solid fa-moon text-indigo-600";
                themeText.textContent = "Gelap";
                toast.className = "fixed bottom-6 right-6 z-50 bg-white border border-slate-200 text-slate-800 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all duration-300";

                ['input-title', 'input-tags', 'input-content', 'input-category'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.className = el.className.replace('bg-slate-950 text-slate-200 border-slate-800', 'bg-slate-50 text-slate-900 border-slate-200');
                });

            } else {
                // Dark Mode Classes
                body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-300";
                header.className = "bg-slate-900 border-b border-slate-800 sticky top-0 z-30 transition-colors duration-300";
                sidebarCard.className = "bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 shadow-sm backdrop-blur transition-colors duration-300";
                tipsCard.className = "bg-gradient-to-br from-indigo-950/40 to-slate-900 border border-indigo-900/30 rounded-2xl p-4 transition-colors duration-300";
                searchInput.className = "w-full bg-slate-900 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner";
                sortSelect.className = "w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition";
                modalBox.className = "bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative transition-colors duration-300";
                
                titleText.className = "font-bold text-lg text-white tracking-tight";
                subtitleText.className = "text-xs text-slate-400";
                catHeaderText.className = "text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 px-2";
                tipsHeader.className = "text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-2";
                tipsDesc.className = "text-xs text-slate-400 leading-relaxed";
                emptyTitle.className = "text-lg font-medium text-slate-300 mb-1";
                emptyState.className = "hidden flex-col items-center justify-center p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-2xl";
                
                themeToggleBtn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl font-medium text-sm transition flex items-center space-x-2 border border-slate-700";
                themeIcon.className = "fa-solid fa-sun text-amber-400";
                themeText.textContent = "Terang";
                toast.className = "fixed bottom-6 right-6 z-50 bg-slate-900 border border-slate-800 text-slate-200 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all duration-300";
            }

            if (animate) {
                renderPrompts();
            }
        }

        // Save prompts to localStorage
        function persistPrompts() {
            localStorage.setItem('prompt_vault_items', JSON.stringify(prompts));
            renderPrompts();
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;
            toastIcon.innerHTML = type === 'success' 
                ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' 
                : '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>';

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        // Open/Close Modal
        function openModal(editId = null) {
            const modal = document.getElementById('prompt-modal');
            const modalTitle = document.getElementById('modal-title');
            const form = document.getElementById('prompt-form');

            form.reset();
            document.getElementById('prompt-id').value = '';

            if (editId) {
                modalTitle.textContent = 'Edit Prompt';
                const prompt = prompts.find(p => p.id === editId);
                if (prompt) {
                    document.getElementById('prompt-id').value = prompt.id;
                    document.getElementById('input-title').value = prompt.title;
                    document.getElementById('input-category').value = prompt.category;
                    document.getElementById('input-tags').value = prompt.tags.join(', ');
                    document.getElementById('input-content').value = prompt.content;
                }
            } else {
                modalTitle.textContent = 'Tambah Prompt Baru';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('prompt-modal').classList.add('hidden');
        }

        // Filter and Search handlers
        function filterCategory(category) {
            currentCategory = category;
            
            // Update active styling on category buttons based on theme
            document.querySelectorAll('#category-list button').forEach(btn => {
                btn.className = currentTheme === 'light'
                    ? "w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition"
                    : "w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition";
            });
            
            const activeBtn = document.getElementById(`cat-${category}`);
            if (activeBtn) {
                activeBtn.className = "w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition bg-indigo-600/10 text-indigo-500 border border-indigo-500/20";
            }

            renderPrompts();
        }

        function handleSearch() {
            currentSearch = document.getElementById('search-input').value.toLowerCase();
            renderPrompts();
        }

        function handleSort() {
            currentSort = document.getElementById('sort-select').value;
            renderPrompts();
        }

        // Copy text helper
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Prompt berhasil disalin ke clipboard!');
            } catch (err) {
                showToast('Gagal menyalin teks.', 'error');
            }
            document.body.removeChild(textarea);
        }

        // Delete prompt
        function deletePrompt(id) {
            if (confirm('Apakah Anda yakin ingin menghapus prompt ini?')) {
                prompts = prompts.filter(p => p.id !== id);
                persistPrompts();
                showToast('Prompt berhasil dihapus.');
            }
        }

        // Save Form Handler
        function savePrompt(e) {
            e.preventDefault();
            const id = document.getElementById('prompt-id').value;
            const title = document.getElementById('input-title').value.trim();
            const category = document.getElementById('input-category').value;
            const tagsRaw = document.getElementById('input-tags').value;
            const content = document.getElementById('input-content').value.trim();

            const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(t => t.length > 0) : [];

            if (id) {
                // Update existing
                const index = prompts.findIndex(p => p.id === id);
                if (index !== -1) {
                    prompts[index] = { ...prompts[index], title, category, tags, content };
                }
                showToast('Prompt berhasil diperbarui!');
            } else {
                // Create new
                const newPrompt = {
                    id: Date.now().toString(),
                    title,
                    category,
                    tags,
                    content,
                    createdAt: Date.now()
                };
                prompts.unshift(newPrompt);
                showToast('Prompt baru berhasil disimpan!');
            }

            closeModal();
            persistPrompts();
        }

        // Main Render Engine
        function renderPrompts() {
            // Update Category Counters
            document.getElementById('count-all').textContent = prompts.length;
            ['Coding', 'Writing', 'Konten', 'Marketing', 'Ideation', 'Lainnya'].forEach(cat => {
                const count = prompts.filter(p => p.category === cat).length;
                const badge = document.getElementById(`count-${cat}`);
                if (badge) badge.textContent = count;
            });

            // Filter logic
            let filtered = prompts.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(currentSearch) ||
                                      p.content.toLowerCase().includes(currentSearch) ||
                                      p.tags.some(t => t.includes(currentSearch));
                return matchesCategory && matchesSearch;
            });

            // Sort logic
            filtered.sort((a, b) => {
                if (currentSort === 'newest') return b.createdAt - a.createdAt;
                if (currentSort === 'oldest') return a.createdAt - b.createdAt;
                if (currentSort === 'title') return a.title.localeCompare(b.title);
            });

            const grid = document.getElementById('prompt-grid');
            const emptyState = document.getElementById('empty-state');

            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.remove('flex');
                emptyState.classList.add('hidden');
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = currentTheme === 'light'
                    ? "bg-white border border-slate-200 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-300 transition group shadow-sm"
                    : "bg-slate-900 border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-700 transition group shadow-sm";
                
                const tagsHtml = p.tags.map(t => currentTheme === 'light'
                    ? `<span class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-lg">#${t}</span>`
                    : `<span class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-lg">#${t}</span>`
                ).join('');

                const contentBoxClass = currentTheme === 'light'
                    ? "bg-slate-50 border border-slate-200 rounded-xl p-3.5 mb-4 font-mono text-xs text-slate-700 max-h-32 overflow-y-auto whitespace-pre-wrap leading-relaxed"
                    : "bg-slate-950/60 border border-slate-800/60 rounded-xl p-3.5 mb-4 font-mono text-xs text-slate-300 max-h-32 overflow-y-auto whitespace-pre-wrap leading-relaxed";

                const titleClass = currentTheme === 'light'
                    ? "font-semibold text-slate-900 text-base group-hover:text-indigo-600 transition"
                    : "font-semibold text-white text-base group-hover:text-indigo-400 transition";

                const copyBtnClass = currentTheme === 'light'
                    ? "bg-slate-100 hover:bg-indigo-600 text-slate-700 hover:text-white px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 shadow-sm"
                    : "bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 shadow-sm";

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <div>
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 mb-2 inline-block">${p.category}</span>
                                <h3 class="${titleClass}">${escapeHtml(p.title)}</h3>
                            </div>
                            <div class="flex items-center space-x-1 opacity-80 group-hover:opacity-100 transition">
                                <button onclick="openModal('${p.id}')" class="p-2 text-slate-400 hover:text-indigo-500 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Edit">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deletePrompt('${p.id}')" class="p-2 text-slate-400 hover:text-rose-500 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Hapus">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <div class="${contentBoxClass}">${escapeHtml(p.content)}</div>
                    </div>
                    <div>
                        <div class="flex flex-wrap gap-1.5 mb-4">${tagsHtml}</div>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-200 dark:border-slate-800/80">
                            <span class="text-xs text-slate-400">${new Date(p.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                            <button onclick="copyToClipboard(${JSON.stringify(p.content).replace(/"/g, '&quot;')})" class="${copyBtnClass}">
                                <i class="fa-solid fa-copy"></i>
                                <span>Salin Prompt</span>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
